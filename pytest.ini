[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# The existing async tests are plain `async def` with no decorator, and the
# suite is written that way throughout. Auto mode collects them without every
# test needing @pytest.mark.asyncio.
asyncio_mode = auto

addopts =
    -q
    --strict-markers
    --tb=short

markers =
    network: test performs a real network call. Deselected by default and never run in CI.
